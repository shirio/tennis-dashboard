<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: sans-serif; padding: 1rem; background: #fff; color: #222; font-size: 13px; }
.cards-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.mcard { background: #f5f4f0; border-radius: 8px; padding: 0.75rem 1rem; }
.mcard-label { font-size: 11px; color: #888; margin-bottom: 3px; }
.mcard-val { font-size: 22px; font-weight: 600; color: #222; }
.mcard-sub { font-size: 11px; color: #888; margin-top: 2px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab { padding: 6px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 13px; background: transparent; color: #666; cursor: pointer; font-weight: 500; }
.tab.on { background: #eee; color: #222; font-weight: 600; border-color: #999; }
.pane { display: none; } .pane.on { display: block; }
.sec-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.07em; margin: 16px 0 8px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; }
th { text-align: left; padding: 5px 6px; color: #888; font-weight: 600; border-bottom: 1px solid #eee; font-size: 11px; }
td { padding: 5px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: top; line-height: 1.4; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.bw { background: #EAF3DE; color: #27500A; } .bl { background: #FCEBEB; color: #791F1F; } .bn { background: #F1EFE8; color: #444; }
.mblock { background: #fff; border: 1px solid #eee; border-radius: 10px; padding: 1rem 1.25rem; margin-bottom: 12px; }
.mhdr { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.mtitle { font-size: 13px; font-weight: 600; } .mscore { font-size: 16px; font-weight: 600; color: #185FA5; }
.line-lbl { font-size: 10px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.05em; margin: 10px 0 3px; }
.line-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 2px 8px; font-size: 12px; align-items: center; }
.lh { color: #aaa; } .lh.w { color: #27500A; font-weight: 600; }
.la { color: #aaa; text-align: right; } .la.w { color: #27500A; font-weight: 600; text-align: right; }
.ls { text-align: center; font-weight: 600; font-size: 11px; white-space: nowrap; color: #aaa; }
.fnote { font-size: 11px; color: #888; margin-top: 8px; line-height: 1.5; border-top: 1px solid #f0f0f0; padding-top: 6px; }
.rtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.rtab { padding: 4px 10px; border: 1px solid #ccc; border-radius: 20px; font-size: 11px; background: transparent; color: #666; cursor: pointer; }
.rtab.on { background: #eee; color: #222; font-weight: 600; }
.rpane { display: none; } .rpane.on { display: block; }
#ap-table td { padding: 6px 8px; }
</style>
<script src="data/players_35.json"></script>
</head><body>

<div id="cards-container"></div>

<div class="tabs" id="main-tabs"></div>

<!-- STANDINGS -->
<div id="standings" class="pane on"></div>

<!-- ROSTERS -->
<div id="rosters" class="pane"></div>

<!-- ALL PLAYERS -->
<div id="allplayers" class="pane"></div>

<!-- ALL RESULTS -->
<div id="all_results" class="pane"></div>

<script>
(function() {
var D = DATA_35;
var teamKeys = ['rrcc2','drag','tpc','dtc1','desert','st1','dtc3'];

// --- Summary Cards ---
var ci = D.division_info;
document.getElementById('cards-container').innerHTML =
'<div class="cards-row">' +
' <div class="mcard"><div class="mcard-label">division</div><div class="mcard-val">' + ci.division + '</div><div class="mcard-sub">' + ci.subtitle + '</div></div>' +
' <div class="mcard"><div class="mcard-label">teams</div><div class="mcard-val">' + ci.teams_count + '</div><div class="mcard-sub">' + ci.matches_played + '</div></div>' +
' <div class="mcard"><div class="mcard-label">leader</div><div class="mcard-val">' + ci.leader + '</div><div class="mcard-sub">' + ci.leader_record + '</div></div>' +
' <div class="mcard"><div class="mcard-label">season through</div><div class="mcard-val">' + ci.season_through + '</div><div class="mcard-sub">' + ci.next_matches + '</div></div>' +
'</div>';

// --- Main Tabs ---
var tabDefs = [
  {id:'standings', label:'standings'},
  {id:'rosters', label:'team rosters'},
  {id:'allplayers', label:'all players'},
  {id:'all_results', label:'all results'}
];
var tabsHtml = '';
tabDefs.forEach(function(t, i) {
  tabsHtml += '<button class="tab' + (i===0?' on':'') + '" onclick="sw(\'' + t.id + '\',this)">' + t.label + '</button>';
});
document.getElementById('main-tabs').innerHTML = tabsHtml;

// --- Standings ---
var sHtml = '<p class="sec-title">league standings \u2014 through week 3 (Mar 28)</p>';
sHtml += '<table style="table-layout:fixed;width:100%"><colgroup><col style="width:20%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col style="width:10%"><col></colgroup>';
sHtml += '<thead><tr><th>team</th><th>record</th><th>courts</th><th>sets lost</th><th>games lost</th><th>team rating</th><th>notes</th></tr></thead><tbody>';
D.standings.forEach(function(s) {
  sHtml += '<tr><td>' + s.name + '</td><td><span class="badge ' + s.record_class + '">' + s.record + '</span></td><td>' + s.courts + '</td><td>' + s.sets_lost + '</td><td>' + s.games_lost + '</td><td>' + s.team_rating + '</td><td>' + s.notes + '</td></tr>';
});
sHtml += '</tbody></table>';
sHtml += '<p class="fnote">' + D.standings_tiebreaker + '</p>';
document.getElementById('standings').innerHTML = sHtml;

// --- Rosters ---
var rHtml = '<div class="rtabs">';
teamKeys.forEach(function(key, i) {
  rHtml += '<button class="rtab' + (i===0?' on':'') + '" onclick="sr(\'' + key + '\',this)">' + D.teams[key].name + '</button>';
});
rHtml += '</div>';
teamKeys.forEach(function(key, i) {
  var team = D.teams[key];
  rHtml += '<div id="' + key + '" class="rpane' + (i===0?' on':'') + '">';
  var secLabel = team.name + ' \u2014 record ' + D.standings.filter(function(s){return s.name===team.name})[0].record;
  if (key === 'rrcc2') secLabel += ' \u2014 leader';
  if (key === 'dtc1') secLabel += ' \u2014 only 2 matches played';
  rHtml += '<p class="sec-title">' + secLabel + '</p>';
  rHtml += '<table><thead><tr><th style="width:20%">player</th><th style="width:7%">old</th><th style="width:7%">new</th><th style="width:8%">local W\u2013L</th><th style="width:17%">lines</th><th>notes</th></tr></thead><tbody>';
  team.players.forEach(function(p) {
    var newVal = p.current_division_rating;
    var oldVal = p.dynamic_rating_baseline;
    var newSpan;
    if (newVal > oldVal + 0.005) newSpan = '<span style="color:#27500A;font-weight:600">' + newVal.toFixed(2) + '</span>';
    else if (newVal < oldVal - 0.005) newSpan = '<span style="color:#791F1F">' + newVal.toFixed(2) + '</span>';
    else newSpan = '<span style="color:#888">' + newVal.toFixed(2) + '</span>';
    rHtml += '<tr><td>' + p.name + '</td><td>' + oldVal.toFixed(2) + '</td><td>' + newSpan + '</td><td>' + p.wl_record + '</td><td>' + p.lines_html + '</td><td style="font-size:11px;color:#555;line-height:1.4">' + p.notes + '</td></tr>';
  });
  rHtml += '</tbody></table>';
  rHtml += '<p class="fnote">' + team.footnote + '</p>';
  rHtml += '</div>';
});
document.getElementById('rosters').innerHTML = rHtml;

// --- All Players ---
var apHtml = '<p class="sec-title">all players \u2014 full division (click name, team, old, or new to sort)</p>';
apHtml += '<input id="ap-search" type="text" placeholder="Search by name or team\u2026" style="margin-bottom:10px;padding:5px 8px;border:1px solid #ddd;border-radius:4px;width:260px;font-size:13px">';
apHtml += '<table id="ap-table" style="width:100%;table-layout:fixed;border-collapse:collapse">';
apHtml += '<colgroup><col style="width:140px"><col style="width:90px"><col style="width:42px"><col style="width:42px"><col style="width:42px"><col></colgroup>';
apHtml += '<thead><tr>';
apHtml += '<th onclick="window.apSort(\'name\')" style="cursor:pointer;user-select:none;padding:6px 8px">player <span id="ap-arr-name">&#x2195;</span></th>';
apHtml += '<th onclick="window.apSort(\'team\')" style="cursor:pointer;user-select:none;padding:6px 8px">team <span id="ap-arr-team">&#x2195;</span></th>';
apHtml += '<th onclick="window.apSort(\'old\')" style="cursor:pointer;user-select:none;padding:6px 8px">old <span id="ap-arr-old">&#x2195;</span></th>';
apHtml += '<th onclick="window.apSort(\'new\')" style="cursor:pointer;user-select:none;padding:6px 8px">new <span id="ap-arr-new">&#x2195;</span></th>';
apHtml += '<th style="padding:6px 8px">W\u2013L</th>';
apHtml += '<th style="padding:6px 8px">lines</th>';
apHtml += '</tr></thead>';
apHtml += '<tbody id="ap-tbody"></tbody></table>';
document.getElementById('allplayers').innerHTML = apHtml;

// All Players sort/search logic
var apData = D.all_players.map(function(p) {
  return {name: p.name, team: p.team, old: p.old, "new": p["new"], wl: p.wl, lines: p.lines};
});
var sortCol = 'new', sortAsc = false;
var lineColors = {
  S1: ['FAECE7','712B13'], S2: ['FAEEDA','633806'],
  D1: ['E6F1FB','0C447C'], D2: ['EAF3DE','27500A'], D3: ['EEEDFE','3C3489']
};
function badgeHtml(lineStr) {
  if (lineStr === '\u2014') return '\u2014';
  return lineStr.split(',').map(function(p) {
    p = p.trim();
    var key = p.substring(0,2);
    var c = lineColors[key] || ['F1EFE8','444'];
    return '<span style="display:inline-block;font-size:10px;font-weight:600;padding:1px 5px;border-radius:8px;background:#' + c[0] + ';color:#' + c[1] + ';margin-right:2px">' + p + '</span>';
  }).join('');
}
function renderAP(rows) {
  var q = (document.getElementById('ap-search').value || '').toLowerCase();
  if (q) rows = rows.filter(function(r) {
    return r.name.toLowerCase().indexOf(q) >= 0 || r.team.toLowerCase().indexOf(q) >= 0;
  });
  var tb = document.getElementById('ap-tbody');
  tb.innerHTML = rows.map(function(r) {
    var newCol = r['new'] > r.old + 0.005 ? '<span style="color:#27500A;font-weight:600">' + r['new'].toFixed(2) + '</span>'
      : r['new'] < r.old - 0.005 ? '<span style="color:#791F1F">' + r['new'].toFixed(2) + '</span>'
      : '<span style="color:#888">' + r['new'].toFixed(2) + '</span>';
    return '<tr><td>' + r.name + '</td><td>' + r.team + '</td><td>' + r.old.toFixed(2) + '</td><td>' + newCol + '</td><td>' + r.wl + '</td><td>' + badgeHtml(r.lines) + '</td></tr>';
  }).join('');
}
window.apSort = function(col) {
  if (sortCol === col) { sortAsc = !sortAsc; }
  else { sortCol = col; sortAsc = (col === 'name' || col === 'team'); }
  ['name','team','old','new'].forEach(function(c) {
    var el = document.getElementById('ap-arr-' + c);
    if (el) el.textContent = c === sortCol ? (sortAsc ? '\u2191' : '\u2193') : '\u2195';
  });
  var sorted = apData.slice().sort(function(a, b) {
    var av = a[col], bv = b[col];
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });
  renderAP(sorted);
};
document.getElementById('ap-search').addEventListener('input', function() {
  var sorted = apData.slice().sort(function(a, b) {
    var av = a[sortCol], bv = b[sortCol];
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });
  renderAP(sorted);
});
apSort('new');

// --- All Results ---
var arHtml = '<div class="rtabs">';
teamKeys.forEach(function(key, i) {
  arHtml += '<button class="rtab' + (i===0?' on':'') + '" onclick="sr2(\'res_' + key + '\',this)">' + D.teams[key].name + '</button>';
});
arHtml += '</div>';
teamKeys.forEach(function(key, i) {
  var matches = D.results_by_team[key] || [];
  arHtml += '<div id="res_' + key + '" class="rpane' + (i===0?' on':'') + '">';
  arHtml += '<p class="sec-title">' + D.teams[key].name + ' \u2014 all results</p>';
  matches.forEach(function(m) {
    arHtml += '<div class="mblock"><div class="mhdr"><span class="mtitle">' + m.title + '</span><span class="mscore" style="color:' + m.outcome_color + '">' + m.outcome + '</span></div>';
    m.lines.forEach(function(l) {
      arHtml += '<div class="line-lbl">' + l.position + '</div>';
      arHtml += '<div class="line-row">';
      arHtml += '<span class="lh' + (l.home_winner ? ' w' : '') + '">' + l.home_player + '</span>';
      arHtml += '<span class="ls">' + l.scores + '</span>';
      arHtml += '<span class="la' + (l.away_winner ? ' w' : '') + '">' + l.away_player + '</span>';
      arHtml += '</div>';
    });
    arHtml += '</div>';
  });
  arHtml += '</div>';
});
document.getElementById('all_results').innerHTML = arHtml;

})();

// --- Tab switching functions ---
function sw(id, el) {
 document.querySelectorAll('.pane').forEach(function(p) { p.classList.remove('on'); });
 document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('on'); });
 document.getElementById(id).classList.add('on');
 el.classList.add('on');
}
function sr(id, el) {
 document.querySelectorAll('#rosters .rpane').forEach(function(p) { p.classList.remove('on'); });
 document.querySelectorAll('#rosters .rtab').forEach(function(t) { t.classList.remove('on'); });
 document.getElementById(id).classList.add('on');
 el.classList.add('on');
}
function sr2(id, el) {
 document.querySelectorAll('#all_results .rpane').forEach(function(p) { p.classList.remove('on'); });
 document.querySelectorAll('#all_results .rtab').forEach(function(t) { t.classList.remove('on'); });
 document.getElementById(id).classList.add('on');
 el.classList.add('on');
}
</script>
</body></html>

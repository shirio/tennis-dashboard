name: Deploy to GitHub Pages

# GitHub's built-in "pages build and deployment" already publishes every push
# to main. Running this workflow on push too made two deploys race for the same
# commit, and this one kept failing ("No artifacts named github-pages"), which
# sent a failure email for nearly every merge. Kept as a manual fallback only.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
